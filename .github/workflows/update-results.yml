name: update-results
on:
  schedule:
    - cron: '20 12 * * 6'   # 토 21:20 KST — 로또 발표 후
    - cron: '20 11 * * 4'   # 목 20:20 KST — 연금복권 발표 후
  workflow_dispatch:         # 수동 실행 버튼
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node fetch-results.mjs
      - name: commit
        run: |
          git config user.name  "results-bot"
          git config user.email "bot@users.noreply.github.com"
          git add results.json
          git diff --quiet HEAD -- results.json || git commit -m "당첨번호 자동 갱신"
          git push
